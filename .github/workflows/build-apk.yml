name: Build Android APK
run-name: Build APK #${{ github.run_number }} (${{ github.ref_name }})

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: apk-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run unit tests
        run: npm test

      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html engine.js ads_service.js www/
          npx cap copy android

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android APK (Release / Debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tounes-tycoon-${{ github.run_number }}-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
